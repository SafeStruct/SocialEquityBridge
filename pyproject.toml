[tool.poetry]
name = "bridge-vulnerability-california"
version = "0.1.0"
description = "Code for the California bridge vulnerability (third) paper."
authors = ["Dominika Malinowska"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ps_predictions", from = "src" }]

[tool.poetry.dependencies]
python = "~3.10"
numpy = "^1.26"
pandas = "^2.2"
geopandas = "^0.14"
shapely = "^2.0"
matplotlib = "^3.8"
seaborn = "^0.13"
cartopy = "^0.22"
scikit-learn = "^1.5"
rasterio = "^1.3"
rasterstats = "^0.19"
factor-analyzer = "^0.5.1"
salib = "^1.5.1"
rpy2 = "^3.5.17"
adjusttext = "^1.3.0"
openpyxl = "^3.1.5"
osmnx = "^1.9"
utm = "^0.7.0"
pyproj = "^3.6"
mpi4py = "^3.1"
tqdm = "^4.66"
scipy = "^1.11"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
