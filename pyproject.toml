[tool.poetry]
name = "bridge-vulnerability-california"
version = "1.0.0"
description = "PCA/PFA-based Bridge Vulnerability Index for California bridges."
authors = ["Dominika Malinowska"]
license = "MIT"
readme = "README.md"
packages = [{ include = "bridge_vulnerability", from = "src" }]

[tool.poetry.dependencies]
python = "~3.10"
numpy = "^1.26"
pandas = "^2.2"
geopandas = "^0.14"
shapely = "^2.0"
matplotlib = "^3.8"
seaborn = "^0.13"
cartopy = "^0.22"
scikit-learn = "^1.5"
rasterio = "^1.3"
rasterstats = "^0.19"
factor-analyzer = "^0.5.1"
salib = "^1.5.1"
adjusttext = "^1.3.0"
openpyxl = "^3.1.5"
pyproj = "^3.6"
tqdm = "^4.66"
scipy = "^1.11"
pyyaml = "^6.0"
jinja2 = "^3.1.6"
mapclassify = ">=2.4.0,<2.10"

[tool.poetry.group.hpc]
optional = true

[tool.poetry.group.hpc.dependencies]
mpi4py = "^4.0"
osmnx = "^1.9"
utm = "^0.7.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"
ruff = "^0.13.0"
pre-commit = "^4.0.0"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/bridge_vulnerability/utils/pca.py" = ["E741"]
"src/bridge_vulnerability/index/build_bvi.py" = ["E741"]
"src/bridge_vulnerability/plotting/*.py" = ["F841"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
